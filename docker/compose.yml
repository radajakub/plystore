# The local trial: Postgres on this machine, reachable from it only (127.0.0.1). The password is a fixed local value, not a secret; kamino gets
# its own stack with Swarm secrets. `make up` / `make down`; the data stays in the volume. One database (plystore), one schema per repo:
# PLYSTORE_DATABASE_URL=postgresql://plystore:plystore@127.0.0.1:55432/plystore uv run plystore-admin migrate --schema plybench plyagents plybench_analysis
name: plystore

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plystore
      POSTGRES_PASSWORD: plystore
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "plystore"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres_data:
