[project]
name = "plystore"
# set by `make release VERSION=X.Y.Z`; the first release is 0.1.0
version = "0.0.0"
description = "One storage interface for the outputs of ply runs: records and logs in memory, in files, or in typed PostgreSQL tables."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jakub Rada", email = "dev.jakubrada@icloud.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# the client has no dependencies: memory, files, routing, the formats and their round trip need nothing else
dependencies = []

[project.optional-dependencies]
# the PostgreSQL backend (typed tables, migrations, the admin command); loaded through the plystore.backends entry point
postgres = ["sqlalchemy>=2.0.40", "psycopg[binary]>=3.2", "alembic>=1.15"]

[project.scripts]
plystore-scan = "plystore.cli:scan_main"
plystore-copy = "plystore.cli:copy_main"
plystore-check = "plystore.cli:check_main"
plystore-admin = "plystore.postgres.admin:main"

[project.entry-points."plystore.backends"]
postgres = "plystore.postgres.store:from_config"

# plybench (and plyagents, plybench_analysis through it) keeps its results in this store when PLYBENCH_STORE=plystore
[project.entry-points."plybench.stores"]
plystore = "plystore.config:open_store"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plystore"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["postgres: needs a PostgreSQL server; skipped unless PLYSTORE_TEST_DATABASE_URL is set (make test-postgres)"]

[tool.ruff]
line-length = 180
target-version = "py312"

[tool.ruff.lint]
# Minimal set: pyflakes (F), essential pycodestyle errors (E4/E7/E9), import sorting (I).
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests", "scripts"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "pyright>=1.1.414",
    "plystore[postgres]",
]
